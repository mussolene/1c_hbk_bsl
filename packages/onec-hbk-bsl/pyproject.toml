[build-system]
requires = ["setuptools>=77", "wheel", "setuptools-scm[toml]>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "onec-hbk-bsl"
dynamic = ["version"]
description = "Meta package for onec-hbk-bsl"
license = "MIT"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "onec-hbk-bsl-core[mcp]",
]

[project.optional-dependencies]
all = [
    "onec-hbk-bsl-core[all]",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools_scm]
root = "../.."
fallback_version = "0.0.0"
