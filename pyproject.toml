[build-system]
requires = ["setuptools>=77", "wheel", "setuptools-scm[toml]>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "onec-hbk-bsl-core"
dynamic = ["version"]
description = "1C Enterprise BSL core formatter, diagnostics, LSP server, and CLI"
license = "MIT"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "tree-sitter>=0.24,<0.26",
    "tree-sitter-bsl>=0.1.7,<0.2",
    "watchfiles>=0.24",
    "pygls>=1.3",
    "rich>=13.0",
    "pyspellchecker>=0.8.1",
    "pymorphy3>=2.0",
    "pymorphy3-dicts-ru>=2.4",
]

[project.optional-dependencies]
mcp = [
    "mcp>=1.27,<2",
]
all = [
    "mcp>=1.27,<2",
]
dev = [
    "mcp>=1.27,<2",
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.9",
    "setuptools-scm>=8",
]
build = [
    "pyinstaller>=6.0",
]

[project.scripts]
onec-hbk-bsl = "onec_hbk_bsl.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"onec_hbk_bsl.analysis.bsl_typo" = ["*.properties"]

# Version from git tags (e.g. v0.7.2). See scripts/README.md.
[tool.setuptools_scm]
fallback_version = "0.0.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=src/onec_hbk_bsl --cov-report=term-missing --cov-fail-under=50"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
omit = [
    "*/tests/*",
]
source = ["src/onec_hbk_bsl"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "S", "UP"]
ignore = [
    "E501",
    "S101",   # assert used in tests
    "S104",   # host="0.0.0.0" intentional for Docker
    "S110",   # try/except pass — intentional fallbacks
    "S603",   # subprocess with fixed args (git diff)
    "S607",   # git from PATH — system dependency
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["onec_hbk_bsl"]

[tool.ruff.format]
quote-style = "double"

[dependency-groups]
dev = [
    "mcp>=1.27,<2",
    "pytest>=9.0",
    "pytest-cov>=7.0",
    "ruff>=0.9",
    "setuptools-scm>=8",
]

[tool.uv.sources]
tree-sitter-bsl = { git = "https://github.com/mussolene/tree-sitter-bsl.git", rev = "5752667f4d40879a533c4ffe3005da10ff0b5e29" }
