# Gitleaks: reduce false positives from intentional BSL test fixtures (fake tokens).
# Run against git history: gitleaks detect --source . --redact --verbose
# Run against the tracked working snapshot:
#   tmp=$(mktemp -d); git archive HEAD | tar -x -C "$tmp"; gitleaks detect --no-git --source "$tmp" --redact --verbose; rm -rf "$tmp"
# See: https://github.com/gitleaks/gitleaks

title = "onec-hbk-bsl"

[extend]
useDefault = true

[[allowlists]]
description = "Diagnostic tests include fake token/password strings to assert BSL012 behavior"
paths = [
  '''tests/test_diagnostics_extended\.py''',
]

[[allowlists]]
description = "Audit doc describes Gitleaks false positives; must not trip generic-api-key on quoted examples"
paths = [
  '''docs/SECURITY_AUDIT\.md''',
]
